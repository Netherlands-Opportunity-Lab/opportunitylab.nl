# Site configuration. Changes here are NOT reloaded by `bundle exec jekyll serve`;
# restart the server after editing.

title: Netherlands Opportunity Lab
description: >-
  Research on inequality, opportunity structures and data-driven policy in the
  Netherlands, using administrative and linked microdata on education, health
  and socioeconomic outcomes.
baseurl: "/opportunitylab.nl"
url: "https://netherlands-opportunity-lab.github.io"
repository: "Netherlands-Opportunity-Lab/opportunitylab.nl"
locale: "en-GB"

# Theme
theme: null
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"
search: true
breadcrumbs: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Netherlands-Opportunity-Lab"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

# Content collections. Each file becomes a page at /<filename>/.
# Outputs link to topics and projects via the `topics:` and `projects:`
# front matter keys (lists of filenames without .md); the related-outputs
# lists on topic and project pages are generated from those keys.
collections:
  outputs:
    output: true
    permalink: /:name/
  projects:
    output: true
    permalink: /:name/
  topics:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
    values:
      layout: single
  - scope:
      path: ""
      type: outputs
    values:
      layout: output
      classes: wide
  - scope:
      path: ""
      type: projects
    values:
      layout: collection-item
      classes: wide
  - scope:
      path: ""
      type: topics
    values:
      layout: collection-item
      classes: wide
